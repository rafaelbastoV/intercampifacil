<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Intercampi Fácil</title>
  <meta name="description" content="Aplicativo de transporte universitário Intercampi Fácil — UNIRIO" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="css/styles.css" />

  <script>
    /* Aplica o tema antes da primeira pintura para evitar flash branco */
    (function () {
      try {
        var t = localStorage.getItem('icf-theme');
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
      } catch (e) { /* noop */ }
    })();
  </script>
</head>
<body>
  <div class="app">

    <!-- ===== HEADER ===== -->
    <header class="header">
      <div class="header-left">
        <div class="logo-badge" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 6v6" /><path d="M15 6v6" /><path d="M2 12h19.6" />
            <path d="M18 18h3s.5-1.7.8-2.8c.1-.4.2-.8.2-1.2 0-.4-.1-.8-.2-1.2l-1.4-5C20.1 6.8 19.1 6 18 6H4a2 2 0 0 0-2 2v10h3" />
            <circle cx="7" cy="18" r="2" /><path d="M9 18h5" /><circle cx="16" cy="18" r="2" />
          </svg>
        </div>
        <div class="header-text">
          <h1>Intercampi Fácil</h1>
          <span>UNIRIO</span>
        </div>
      </div>
      <div class="header-right">
        <button type="button" id="theme-btn" class="theme-btn" aria-label="Alternar modo escuro" aria-pressed="false" title="Modo escuro">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
          </svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4" />
          </svg>
        </button>
        <span class="status-dot" aria-hidden="true"></span>
        <span id="header-status">Online</span>
      </div>
    </header>

    <!-- ===== CONTEÚDO ===== -->
    <main class="content">

      <!-- ===================== VIEW: HOME ===================== -->
      <section id="view-home" class="view">
        <div class="map-wrap">
          <div id="home-map" class="map" aria-label="Mapa do Rio de Janeiro"></div>
        </div>

        <section class="route-card">
          <span class="route-dash" aria-hidden="true"></span>

          <div class="route-fields">
            <div class="route-row">
              <span class="pin pin-origin" aria-hidden="true"></span>
              <div class="field">
                <input type="text" id="origin" placeholder="Onde estou" autocomplete="off" />
                <button type="button" id="locate-btn" class="icon-btn" title="Usar minha localização" aria-label="Usar minha localização">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="7" /><path d="M12 2v3M22 12h-3M12 22v-3M2 12h3" />
                  </svg>
                </button>
              </div>
            </div>

            <div class="route-row">
              <span class="pin pin-flag" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z" />
                  <line x1="4" x2="4" y1="22" y2="15" />
                </svg>
              </span>
              <div class="field-wrap">
                <div class="field">
                  <input type="text" id="destination" placeholder="Para onde vou" autocomplete="off"
                         role="combobox" aria-expanded="false" aria-controls="dest-suggest" aria-autocomplete="list" />
                </div>
                <div class="suggest-list" id="dest-suggest" role="listbox" hidden></div>
              </div>
            </div>
          </div>

          <button type="button" id="swap-btn" class="swap-btn" title="Trocar origem e destino" aria-label="Trocar origem e destino">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <path d="m21 16-4 4-4-4" /><path d="M17 20V4" /><path d="m3 8 4-4 4 4" /><path d="M7 4v16" />
            </svg>
          </button>
        </section>

        <p class="route-notice">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="9" /><path d="M12 8h.01M11 12h1v4h1" />
          </svg>
          <span>As rotas exibidas são <strong>estimativas</strong> e ainda estão sendo refinadas.</span>
        </p>

        <section class="next-trip-card" id="next-trip-card" hidden></section>

        <section class="trips-section" id="em-curso-section" hidden>
          <div class="trips-header">
            <h2 class="trips-title">
              <span class="live-dot" aria-hidden="true"></span>
              Ônibus em curso
            </h2>
            <span class="trips-count" id="em-curso-count">—</span>
          </div>
          <div class="trips-list" id="em-curso-list"></div>
        </section>

        <section class="trips-section">
          <div class="trips-header">
            <h2 class="trips-title">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="9" /><path d="M12 7v5l3 2" />
              </svg>
              Próximas viagens
            </h2>
            <span class="trips-count" id="trips-count">…</span>
          </div>
          <div class="trips-list" id="trips-list"></div>
        </section>
      </section>

      <!-- ===================== VIEW: LINHAS ===================== -->
      <section id="view-linhas" class="view" hidden>
        <div class="page-head">
          <h2 class="page-title">Linhas</h2>
          <p class="page-sub" id="linhas-count">Carregando…</p>
        </div>
        <div id="linhas-list" class="linhas-list"></div>
      </section>

      <!-- ===================== VIEW: ROTA ===================== -->
      <section id="view-rota" class="view" hidden>
        <a href="#/linhas" class="back-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m15 18-6-6 6-6" />
          </svg>
          Linhas
        </a>

        <div class="rota-head">
          <div class="bus-icon" id="rota-icon" aria-hidden="true"></div>
          <div class="rota-head-text">
            <div class="modal-title" id="rota-title"></div>
            <div class="modal-route" id="rota-route"></div>
          </div>
        </div>

        <div class="map-wrap rota-map-wrap">
          <div id="rota-map" class="map" aria-label="Mapa da rota do ônibus"></div>
        </div>

        <div class="rota-info" id="rota-info"></div>

        <div class="modal-stops-title">Itinerário</div>
        <div class="rota-stops" id="rota-stops"></div>
      </section>

    </main>

    <!-- ===== NAVEGAÇÃO INFERIOR ===== -->
    <nav class="bottom-nav">
      <div class="bottom-nav-inner">
        <a class="nav-item active" data-nav="home" href="#/home" aria-label="Home">
          <span class="nav-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 10.5 12 3l9 7.5" /><path d="M5 9.5V21h14V9.5" />
            </svg>
          </span>
          <span class="nav-label">Home</span>
        </a>

        <a class="nav-item" data-nav="linhas" href="#/linhas" aria-label="Linhas">
          <span class="nav-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <path d="M8 6v6" /><path d="M15 6v6" /><path d="M2 12h19.6" />
              <path d="M18 18h3s.5-1.7.8-2.8c.1-.4.2-.8.2-1.2 0-.4-.1-.8-.2-1.2l-1.4-5C20.1 6.8 19.1 6 18 6H4a2 2 0 0 0-2 2v10h3" />
              <circle cx="7" cy="18" r="2" /><path d="M9 18h5" /><circle cx="16" cy="18" r="2" />
            </svg>
          </span>
          <span class="nav-label">Linhas</span>
        </a>
      </div>
    </nav>

  </div>

  <!-- ===== MODAL DA VIAGEM ===== -->
  <div class="modal" id="trip-modal" hidden>
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button type="button" class="modal-close" data-close-modal aria-label="Fechar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12" /></svg>
      </button>
      <div id="modal-content"></div>
    </div>
  </div>

  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
